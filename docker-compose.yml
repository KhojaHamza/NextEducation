services:
  db:
    image: postgres:16
    container_name: ecole-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ecole
      POSTGRES_PASSWORD: ecole_pwd
      POSTGRES_DB: ecole_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: