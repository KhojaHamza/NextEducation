name: nextedu-test

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nextedu
      POSTGRES_PASSWORD: motdepasse_local
      POSTGRES_DB: nextedu
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextedu"]
      interval: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://nextedu:motdepasse_local@db:5432/nextedu?schema=public
      JWT_SECRET: secret-de-test-local
      JWT_EXPIRES_IN: 1h
      CLIENT_URL: http://localhost:4000
      CURRENCY: TND
      ENABLE_SCHEDULER: "false"
      UPLOAD_DIR: uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: